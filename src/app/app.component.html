<style>
  .spinner-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999; /* Make sure spinner appears above other content */
}

.spinner {
  border: 8px solid #f3f3f3;
  border-top: 8px solid #3498db;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

</style>

  <div class="col-sm-12"><h1 style="margin-bottom: 2%;text-align: center;">E-commerce Dashboard</h1></div>
  <div class="spinner-container" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>
  <div class="col-sm-12" style="height: 600px; width: 100%;">

    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [pagination]="true"
      style="height: 600px;width: 100%;"
    ></ag-grid-angular>
  </div>
